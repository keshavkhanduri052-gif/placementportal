
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Placement Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 380px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        #togglePassword {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: #172554;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-text a, .back-home {
            color: #172554;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your Placement Portal</p>

    <form id="loginform">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input type="password" id="password"
                       placeholder="Enter your password" required>
                <button type="button" id="togglePassword">Show</button>
            </div>
        </div>

        <div class="form-group">
            <label for="role">Login As</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit" class="login-button">
            Login
        </button>

        <p id="message"></p>

    </form>

    <p class="register-text">
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

    <a href="index.html" class="back-home">← Back to Home</a>

</div>

<script>
const form = document.getElementById("loginform");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const message = document.getElementById("message");
const button = form.querySelector('button[type="submit"]');

// Show / Hide Password
togglePassword.addEventListener("click", function() {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "Hide";
    } else {
        passwordInput.type = "password";
        togglePassword.textContent = "Show";
    }
});

// Login
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;
    const role = document.getElementById("role").value;

    message.textContent = "";
    message.style.color = "red";

    if (!role) {
        message.textContent = "Please select your role.";
        return;
    }

    
// Admin login through MongoDB API
if (role === "admin") {
    fetch("http://localhost:5000/api/admin/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.admin) {
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("userRole", "admin");
            localStorage.setItem("adminData", JSON.stringify(data.admin));

            message.style.color = "green";
            message.textContent = "Admin login successful!";

            window.location.href = "admin.html";
        } else {
            message.style.color = "red";
            message.textContent = data.message || "Invalid Admin email or password!";
        }
    })
    .catch(error => {
        console.error("Admin Login Error:", error);
        message.textContent = "Server connection failed!";
    });

    return;
}


    // Student login
    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "Connecting to server...";

    try {
        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Login failed.");
        }

        if (!result.student || !result.student.id) {
            throw new Error("Invalid response from server.");
        }

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userRole", "student");
        localStorage.setItem("studentId", result.student.id);
        localStorage.setItem(
            "studentName",
            result.student.firstName + " " + result.student.lastName
        );
        localStorage.setItem("studentEmail", result.student.email);

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Login error:", error);
        message.style.color = "red";
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>

</body>
</html>
