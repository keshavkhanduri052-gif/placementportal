<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Placement Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .register-container h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #172554;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-button:hover {
            background: #1e3a8a;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            color: #172554;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .register-container {
                width: 100%;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register for the Student Placement Portal
        </p>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="bca">BCA</option>
                        <option value="bba">BBA</option>
                        <option value="bsc">B.Sc</option>
                        <option value="ba">B.A</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="M.Tech">M.Tech</option>
                        <option value="MBA">MBA</option>
                        <option value="BBA">BBA</option>
                    </select>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="year">Year</label>

                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="college">College</label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter college name"
                        required
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required>
              
            </div>


            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >
            </div>


            <button type="submit" class="register-button">
                Create Account
            </button>

        </form>


        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>
    
<script>
const form = document.querySelector("form");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    if (password.length < 8) {
        alert("Password must be at least 8 characters.");
        return;
    }

    const user = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        course: document.getElementById("course").value,
        year: document.getElementById("year").value,
        college: document.getElementById("college").value.trim(),
        password: password
    };

    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = "Registering...";

    try {
        const response = await fetch("https://placementportal-api.onrender.com/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message || "Registration failed.");
            return;
        }

        alert("Registration successful! Please login.");
        window.location.href = "login.html";

    } catch (error) {
        console.error("Registration error:", error);
        alert("Unable to connect to the backend. Check if the server is running.");
    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
});
</script>


</body>

</html>
